name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types and build
        run: npm run build
      - name: Set up Python for browser integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend for browser tests
        run: python -m pip install -r ../src/backend/requirements.txt
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile integration tests
        run: npm test
