name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check backend presence
        id: check_backend
        run: |
          if [ -f "backend/requirements.txt" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "backend/requirements.txt not found, skipping."
          fi

      - name: Set up Python
        if: steps.check_backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        if: steps.check_backend.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Run Ruff Linter
        if: steps.check_backend.outputs.present == 'true'
        run: |
          ruff check backend/

      - name: Run Pytest
        if: steps.check_backend.outputs.present == 'true'
        run: |
          pytest tests/ -v

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend presence
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found, skipping."
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        if: steps.check_frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Linter
        if: steps.check_frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run Tests
        if: steps.check_frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present
