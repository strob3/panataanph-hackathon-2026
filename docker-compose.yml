services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panataanph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PANATAANPH_DB_PATH=/app/data/panataanph.db
      - PANATAANPH_STORAGE_PATH=/app/storage
      - PANATAANPH_ALLOWED_ORIGINS=https://panataanph.vercel.app,http://localhost:5173
    volumes:
      - backend-data:/app/data
      - backend-storage:/app/storage

volumes:
  backend-data:
  backend-storage:
